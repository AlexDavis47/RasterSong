# cargo-about configuration: generates the third-party notices shipped with packages
# (`cargo xtask dist`). Keep `accepted` in step with the license allow list in deny.toml.

accepted = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "MPL-2.0",
    "Unicode-3.0",
    "CC0-1.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "WTFPL",
]

# Only what ships in the app binary.
ignore-dev-dependencies = true
ignore-build-dependencies = true
private = { ignore = true }
