[package]
name = "rastersong-graph"
description = "Signal type, node contract, scheduler and built-in nodes for RasterSong"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
rastersong-lang.workspace = true
serde.workspace = true
serde_json.workspace = true

[features]
# Test helpers for other crates: `rastersong_graph::testing`.
testing = []

[dev-dependencies]
# The crate's own test helpers, for the integration tests.
rastersong-graph = { path = ".", features = ["testing"] }
criterion.workspace = true
proptest.workspace = true

[[bench]]
name = "nodes"
harness = false

[lints]
workspace = true
