# cargo-deny policy. Run locally with `cargo deny check`; CI runs it on every push.
# RasterSong is distributed as a source-available product, so every dependency must use a
# permissive license. Copyleft licenses (GPL, LGPL, AGPL) are never allowed in Rust dependencies;
# FFmpeg is the only LGPL component and is dynamically linked (see docs/licensing.md).

[graph]
all-features = true

[advisories]
yanked = "deny"
# Report unmaintained crates we depend on directly; transitive ones are the upstream crate's call.
unmaintained = "workspace"

[licenses]
confidence-threshold = 0.9
unused-allowed-license = "allow"
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "MPL-2.0",
    "Unicode-3.0",
    "CC0-1.0",
    # egui's bundled default fonts
    "OFL-1.1",
    "Ubuntu-font-1.0",
]

# The FFmpeg bindings are WTFPL (permissive). Allowed per crate rather than globally.
exceptions = [
    { crate = "ffmpeg-next", allow = ["WTFPL"] },
    { crate = "ffmpeg-sys-next", allow = ["WTFPL"] },
]

[licenses.private]
# Workspace crates use the RasterSong license (license-file), not an SPDX expression.
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
